# Every push and pull request runs the extension's tests and builds the archive
# the catalog would publish. The Release workflow runs this same workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test dependencies
        run: pip install pytest==8.3.5 PyYAML==6.0.3
      - name: Extension tests
        run: |
          if [ -d tests ]; then python -m pytest -q -p no:cacheprovider tests; else echo "no tests/"; fi
      - name: Package the archive
        run: python scripts/package_extension.py
      - name: The catalog would accept it
        run: python scripts/catalog_check.py dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.zip
          if-no-files-found: error
