name: Validate submission

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The base branch is needed to compare an edited entry with the listed one.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Test the index builder
        run: python -m pytest -q scripts
      - name: Check the submitted extensions with the base branch's checker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FS_CATALOG_ROOT: ${{ github.workspace }}
        run: |
          # The pull request's own copy of the checker is not trusted to judge it.
          git show "origin/${{ github.base_ref }}:scripts/build_index.py" > "$RUNNER_TEMP/build_index.py"
          python "$RUNNER_TEMP/build_index.py" --check \
            --base "origin/${{ github.base_ref }}" \
            --submitter "${{ github.event.pull_request.user.login }}"
