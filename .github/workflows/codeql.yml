name: CodeQL

on:
  push:
    branches-ignore:
      - "dependabot/**"
  pull_request:
  schedule:
    - cron: "26 1 * * 2"
  workflow_dispatch:

permissions:
  contents: read
cache-mode: none

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
    uses: ./.github/workflows/codeql-scan.yml
    with:
      language: ${{ matrix.language }}
      build-mode: ${{ matrix.build-mode }}
