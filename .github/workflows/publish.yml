name: Publish new releases

on:
  # Authors publish by making a GitHub Release in their own repository; the
  # catalog picks it up on the next run.
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "categories.json"
      - "verified_publishers.json"
      - "scripts/build_index.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-index
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Record new releases and build index.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_index.py --publish
      - name: Commit release records and index.json when they changed
        run: |
          git add releases index.json
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish extension releases"
          git push
