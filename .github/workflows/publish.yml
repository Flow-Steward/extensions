name: Publish new releases

on:
  # Authors publish by making a GitHub Release in their own repository; the
  # catalog picks it up on the next run.
  schedule:
    # New releases appear in the index within minutes; the hourly run also
    # downloads every listed asset again and withdraws one whose bytes changed.
    - cron: "*/5 * * * *"
    - cron: "17 * * * *"
  # An extension's Release workflow can announce a new release right away
  # (POST /repos/Flow-Steward/extensions/dispatches, event_type extension-released;
  # needs a token with Actions write on this repository, stored in that repo).
  repository_dispatch:
    types: [extension-released]
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "categories.json"
      - "verified_publishers.json"
      - "scripts/build_index.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-index
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Record new releases and their icons
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Only the hourly run re-downloads listed assets.
          SKIP_RECHECK: ${{ github.event_name == 'schedule' && github.event.schedule != '17 * * * *' }}
        run: python scripts/build_index.py --publish --records-only ${{ env.SKIP_RECHECK == 'true' && '--skip-recheck' || '' }}
      - name: Commit the release records first
        # The index pins each icon URL to the commit that added it, so the
        # records and icons are committed before the index is built.
        run: |
          git add releases
          git diff --cached --quiet || git commit -m "Record extension releases"
      - name: Build index.json
        run: python scripts/build_index.py
      - name: Commit index.json and push when anything changed
        run: |
          git add index.json
          git diff --cached --quiet || git commit -m "Publish extension releases"
          if git diff --quiet origin/main HEAD; then
            echo "Nothing new to publish."
            exit 0
          fi
          git push
