name: Test shared extension release tooling

on:
  push:
    branches: [main]
    paths:
      - scripts/release_extension.py
      - scripts/test_release_extension.py
      - scripts/publish_extension_release.py
      - scripts/test_publish_extension_release.py
      - scripts/test_release_workflows.py
      - .github/workflows/build-extension.yml
      - .github/workflows/release-extension.yml
      - .github/workflows/test-release-tooling.yml
  pull_request:
    paths:
      - scripts/release_extension.py
      - scripts/test_release_extension.py
      - scripts/publish_extension_release.py
      - scripts/test_publish_extension_release.py
      - scripts/test_release_workflows.py
      - .github/workflows/build-extension.yml
      - .github/workflows/release-extension.yml
      - .github/workflows/test-release-tooling.yml
  workflow_dispatch:

permissions:
  contents: read
cache-mode: none

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3 pytest==9.0.3
      - run: python -m pytest -q scripts/test_release_extension.py scripts/test_publish_extension_release.py scripts/test_release_workflows.py scripts/test_build_index.py
