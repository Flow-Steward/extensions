name: Publish validated extension release

on:
  workflow_call:
    inputs:
      tag:
        description: Immutable v<semver> tag to publish
        required: true
        type: string
      build_native:
        description: Rebuild locked native payloads using the extension's source builder
        type: boolean
        default: false

permissions:
  contents: read
cache-mode: none

concurrency:
  group: extension-release-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_owner == 'Flow-Steward' && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    uses: ./.github/workflows/build-extension.yml
    with:
      tag: ${{ inputs.tag }}
      build_native: ${{ inputs.build_native }}
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out trusted publication tooling only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Flow-Steward/extensions
          ref: 4ad7b1131c72c381d6bcbb5613f209b077a01ce0
          path: tooling
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - name: Download this run's artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-artifacts
      - name: Revalidate artifact identity, sizes, hashes and archive contract
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          python tooling/scripts/release_extension.py verify-plan \
            --artifact-dir release-artifacts --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --catalog-root tooling
      - name: Publish once, or verify an identical existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          python tooling/scripts/publish_extension_release.py \
            --artifact-dir release-artifacts --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA"
